<!DOCTYPE html>
<html>
<head>
    <title>Ration History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h3 class="text-center mb-4">Ration Distribution History</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>User</th>
                <th>Item</th>
                <th>Quantity</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>
            {% for d in distributions %}
            <tr>
                <td>{{ d.user.name }}</td>
                <td>{{ d.item_name }}</td>
                <td>{{ d.quantity }}</td>
                <td>{{ d.date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
