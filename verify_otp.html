<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4 text-center" style="max-width: 420px; margin: auto;">

        <div style="font-size: 50px;">🔐</div>
        <h3 class="mt-2 mb-1">OTP Verification</h3>
        <p class="text-muted mb-4">Enter the 4-digit OTP sent to the user</p>

        {% if error %}
        <div class="alert alert-danger">❌ {{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input
                type="text"
                name="otp"
                maxlength="4"
                placeholder="_ _ _ _"
                class="form-control form-control-lg text-center mb-3"
                style="letter-spacing: 10px; font-size: 28px; font-weight: bold;"
                autofocus
            >
            <button type="submit" class="btn btn-success w-100 btn-lg">✅ Verify OTP</button>
        </form>

        <a href="{% url 'send_otp' %}" class="btn btn-outline-secondary w-100 mt-2">🔄 Resend OTP</a>
        <a href="{% url 'shop_dashboard' %}" class="btn btn-secondary w-100 mt-2">⬅ Back</a>

    </div>
</div>
</body>
</html>
