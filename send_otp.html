<!DOCTYPE html>
<html>
<head>
    <title>Send OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4" style="max-width: 500px; margin: auto;">

        <div class="text-center mb-3" style="font-size: 45px;">📤</div>
        <h3 class="text-center mb-4">Send OTP</h3>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Select User</label>
                <select name="user" class="form-control">
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.name }} — {{ u.mobile }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-warning w-100">Generate & Send OTP</button>
        </form>

        {% if otp %}
            {% if email_sent %}
            <div class="alert alert-success mt-3 text-center">
                ✅ OTP sent to <strong>{{ user_email }}</strong>
            </div>
            {% else %}
            <div class="mt-4 p-3 border rounded text-center" style="background:#f0fff0;">
                <p class="mb-1 text-muted">OTP for <strong>{{ user_name }}</strong></p>
                <h1 style="letter-spacing: 12px; color: #198754; font-weight: bold;">{{ otp }}</h1>
                <p class="text-muted" style="font-size:13px;">⚠️ No email found — tell OTP verbally to user</p>
            </div>
            {% endif %}
            <a href="{% url 'verify_otp' %}" class="btn btn-success w-100 mt-3">🔐 Proceed to Verify OTP</a>
        {% endif %}

        <a href="{% url 'shop_dashboard' %}" class="btn btn-secondary w-100 mt-2">⬅ Back</a>

    </div>
</div>
</body>
</html>
