<!DOCTYPE html>
<html>
<head>
    <title>Distribute Ration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4" style="max-width: 600px; margin: auto;">

        <h3 class="text-center mb-4">🍚 Distribute Ration</h3>

        {% if errors %}
            {% for e in errors %}
                <div class="alert alert-danger">{{ e }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Select User</label>
                <select name="user" class="form-control" id="userSelect" onchange="loadAllowance(this.value)">
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Remaining Allowance Badge -->
            <div id="allowanceBox" class="alert alert-info text-center mb-3" style="display:none;">
                Remaining this month:
                🌾 Rice: <strong id="r_rice">-</strong> kg &nbsp;|&nbsp;
                🌾 Wheat: <strong id="r_wheat">-</strong> kg &nbsp;|&nbsp;
                🍬 Sugar: <strong id="r_sugar">-</strong> kg
            </div>

            <div class="mb-3">
                <label>Rice (kg) <small class="text-muted" id="rice_hint"></small></label>
                <input type="number" name="rice" id="rice" class="form-control" value="0" min="0">
            </div>
            <div class="mb-3">
                <label>Wheat (kg) <small class="text-muted" id="wheat_hint"></small></label>
                <input type="number" name="wheat" id="wheat" class="form-control" value="0" min="0">
            </div>
            <div class="mb-3">
                <label>Sugar (kg) <small class="text-muted" id="sugar_hint"></small></label>
                <input type="number" name="sugar" id="sugar" class="form-control" value="0" min="0">
            </div>

            <button type="submit" class="btn btn-success w-100">Distribute</button>
        </form>

        <a href="{% url 'shop_dashboard' %}" class="btn btn-secondary w-100 mt-2">⬅ Back</a>
    </div>
</div>

<script>
function loadAllowance(userId) {
    if (!userId) return;
    fetch(`/user-allowance/${userId}/`)
        .then(r => r.json())
        .then(data => {
            document.getElementById('r_rice').innerText  = data.remaining_rice;
            document.getElementById('r_wheat').innerText = data.remaining_wheat;
            document.getElementById('r_sugar').innerText = data.remaining_sugar;
            document.getElementById('allowanceBox').style.display = 'block';

            document.getElementById('rice').max  = data.remaining_rice;
            document.getElementById('wheat').max = data.remaining_wheat;
            document.getElementById('sugar').max = data.remaining_sugar;

            document.getElementById('rice_hint').innerText  = `(max ${data.remaining_rice} kg)`;
            document.getElementById('wheat_hint').innerText = `(max ${data.remaining_wheat} kg)`;
            document.getElementById('sugar_hint').innerText = `(max ${data.remaining_sugar} kg)`;
        });
}

// Load on page open for first user
window.onload = () => {
    const sel = document.getElementById('userSelect');
    if (sel.value) loadAllowance(sel.value);
};
</script>
</body>
</html>
