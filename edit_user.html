<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4" style="max-width: 520px; margin: auto;">

        <div class="text-center mb-2" style="font-size:40px;">✏️</div>
        <h4 class="text-center mb-4">Edit User — {{ u.name }}</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-2">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ u.name }}" required>
            </div>
            <div class="mb-2">
                <label>Mobile Number</label>
                <input type="text" name="mobile" class="form-control" value="{{ u.mobile }}" required>
            </div>
            <div class="mb-2">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ u.email }}" required>
            </div>
            <div class="mb-2">
                <label>Password</label>
                <input type="text" name="password" class="form-control" value="{{ u.password }}" required>
            </div>
            <div class="mb-2">
                <label>Ration Card Number</label>
                <input type="text" name="ration_card_no" class="form-control" value="{{ u.ration_card_no }}" required>
            </div>
            <div class="mb-2">
                <label>Address</label>
                <textarea name="address" class="form-control" rows="2" required>{{ u.address }}</textarea>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-2">💾 Save Changes</button>
        </form>

        <a href="{% url 'add_user' %}" class="btn btn-secondary w-100 mt-2">⬅ Back</a>

    </div>
</div>
</body>
</html>
